# Run all of PaperTrail with one command:
#
#   docker compose up --build
#
# then open http://localhost:3000. The GCN pilot reproduction is loaded on first start;
# its project token is printed by the "seed" service (docker compose logs seed).
# Data lives in the "papertrail-db" volume; `docker compose down -v` removes it.
# To use a hosted PostgreSQL instead, copy .env.example to .env and set DATABASE_URL.
name: papertrail

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: papertrail
      POSTGRES_PASSWORD: papertrail
      POSTGRES_DB: papertrail
    volumes:
      - papertrail-db:/var/lib/postgresql/data
    healthcheck:
      # Over TCP on purpose: on first run the image starts a temporary server that only
      # listens on a local socket, and a socket check would report ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U papertrail -d papertrail"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: papertrail-api
    restart: unless-stopped
    environment:
      # Set DATABASE_URL in a .env file next to this one to use a hosted database
      # (see .env.example); otherwise the bundled "db" service is used.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://papertrail:papertrail@db:5432/papertrail}
      PAPERTRAIL_WEB_ORIGINS: http://localhost:3000
      # OPENALEX_API_KEY: ""   # optional, for frequent DOI imports
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: papertrail-api
    command: ["python", "scripts/seed_pilot.py", "--api", "http://api:8000"]
    restart: "no"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        PAPERTRAIL_API_URL: http://api:8000
    image: papertrail-web
    restart: unless-stopped
    environment:
      PAPERTRAIL_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  papertrail-db:
