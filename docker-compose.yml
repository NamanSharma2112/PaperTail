# Run PaperTrail with one command:
#
#   docker compose up --build
#
# then open http://localhost:3000 and create an account.
#
# Database: by default the bundled PostgreSQL below. To use a hosted database (Aiven,
# Neon, ...), put DATABASE_URL=postgres://... in a .env file next to this one; see
# .env.example. Migrations run automatically when the app starts.
#
# Demonstration data (the GCN pilot) can be loaded into your account afterwards:
#   docker compose exec web node scripts/seed-pilot.mjs --email you@example.org
name: papertrail

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: papertrail
      POSTGRES_PASSWORD: papertrail
      POSTGRES_DB: papertrail
    volumes:
      - papertrail-db:/var/lib/postgresql/data
    healthcheck:
      # Over TCP on purpose: on first run the image starts a temporary server that only
      # listens on a local socket, and a socket check would report ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U papertrail -d papertrail"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: papertrail-web
    restart: unless-stopped
    environment:
      # The bundled database's owner is a superuser; the app still enforces row-level
      # security through its restricted papertrail_app role.
      DATABASE_URL: ${DATABASE_URL:-postgres://papertrail:papertrail@db:5432/papertrail}
      DATABASE_CA_CERT: ${DATABASE_CA_CERT:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${APP_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      ARTIFACT_PROJECT_QUOTA_MB: ${ARTIFACT_PROJECT_QUOTA_MB:-50}
      SDK_RATE_LIMIT_PER_MIN: ${SDK_RATE_LIMIT_PER_MIN:-600}
    volumes:
      - papertrail-data:/data
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  papertrail-db:
  papertrail-data:
