[project]
name = "papertrail-analysis"
version = "0.1.0"
description = "Reference statistics for PaperTrail: the definitions the web app's TypeScript port is tested against"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["papertrail_analysis"]
