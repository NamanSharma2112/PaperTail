[project]
name = "papertrail"
version = "0.1.0"
description = "Record research runs and send them to a PaperTrail workspace"
# Old on purpose: published research code often only runs on old interpreters.
requires-python = ">=3.7"
dependencies = []

[project.scripts]
papertrail = "papertrail.cli:main"

[build-system]
requires = ["setuptools>=40.8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["papertrail"]
